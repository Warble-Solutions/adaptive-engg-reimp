# Netlify build settings (used when the GitHub repo is connected).
# If the repo root is the `adaptive-form` folder, set "Base directory" to `web` in Netlify,
# or keep this file inside `web/` and push `web/` as the repo root.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Old WordPress URLs → new pages (keeps Google links & bookmarks working)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/aboutus/*"
  to = "/about/"
  status = 301
